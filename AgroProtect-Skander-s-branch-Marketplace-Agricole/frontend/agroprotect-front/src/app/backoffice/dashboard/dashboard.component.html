<div class="page-header">
  <div class="page-header-info">
    <h2>Statistiques</h2>
    <span class="page-subtitle">Vue d'ensemble de la plateforme</span>
  </div>
</div>

<!-- Loading Spinner -->
<div class="content-card" [hidden]="!loading">
  <div class="state-block">
    <div class="spinner-border text-success" role="status"></div>
    <span class="ms-2 text-muted">Chargement des statistiques...</span>
  </div>
</div>

<!-- Dashboard Content (Always in DOM, just hidden until loaded) -->
<div [hidden]="loading">
  
  <!-- TOP ROW: 3 PIE CHARTS -->
  <div class="row g-4 mb-4">
    
    <div class="col-md-4">
      <div class="content-card">
        <div class="card-header-custom">
          <i class="bi bi-megaphone-fill"></i> Annonces
        </div>
        <div class="chart-container">
          <canvas #annonceChart></canvas>
        </div>
        <div class="chart-footer">
          <span class="total-badge">{{ totalAnnonces }} Total</span>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="content-card">
        <div class="card-header-custom">
          <i class="bi bi-cash-stack"></i> Funds
        </div>
        <div class="chart-container">
          <canvas #matchChart></canvas>
        </div>
        <div class="chart-footer">
          <span class="total-badge">{{ totalMatches }} Total</span>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="content-card">
        <div class="card-header-custom">
          <i class="bi bi-bell-fill"></i> Notifications
        </div>
        <div class="chart-container">
          <canvas #notifChart></canvas>
        </div>
        <div class="chart-footer">
          <span class="total-badge">{{ totalNotifications }} Total</span>
        </div>
      </div>
    </div>

  </div>

    <!-- BOTTOM ROW: 2 CHARTS -->
    <div class="row g-4">
    
      <!-- NEW: Funding Status Pie Chart -->
      <div class="col-md-6">
        <div class="content-card">
          <div class="card-header-custom">
            <i class="bi bi-pie-chart-fill"></i> Statut de Financement des Annonces
          </div>
          <div class="chart-container">
            <canvas #fundingStatusChart></canvas>
          </div>
          <div class="chart-footer">
            <span class="total-badge">{{ totalFundingStatus }} Total</span>
          </div>
        </div>
      </div>
  
      <!-- EXISTING: Finances Bar Chart -->
      <div class="col-md-6">
        <div class="content-card">
          <div class="card-header-custom">
            <i class="bi bi-cash-stack"></i> Finances Globales (TND)
          </div>
          <div class="chart-container" style="height: 300px;">
            <canvas #fundChart></canvas>
          </div>
        </div>
      </div>
  
    </div>
