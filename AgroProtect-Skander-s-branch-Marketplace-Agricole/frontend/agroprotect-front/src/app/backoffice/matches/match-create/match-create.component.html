<div class="container mt-4">
    <h2>Create New Match</h2>
  
    <!-- Error -->
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card p-4 mt-3">
  
      <!-- Annonce ID -->
      <div class="mb-3">
        <label class="form-label">Annonce ID *</label>
        <input type="number" class="form-control" formControlName="annonceId" placeholder="Enter annonce ID" min="1">
        <div class="text-danger small" *ngIf="form.get('annonceId')?.invalid && form.get('annonceId')?.touched">
          Annonce ID is required
        </div>
      </div>
  
      <!-- Investisseur ID -->
      <div class="mb-3">
        <label class="form-label">Investisseur ID *</label>
        <input type="number" class="form-control" formControlName="investisseurId" placeholder="Enter investor ID" min="1">
        <div class="text-danger small" *ngIf="form.get('investisseurId')?.invalid && form.get('investisseurId')?.touched">
          Investisseur ID is required
        </div>
      </div>
  
      <!-- Status -->
      <div class="mb-3">
        <label class="form-label">Status *</label>
        <select class="form-select" formControlName="status">
          <option [value]="statusMatch.EN_ATTENTE">En Attente</option>
          <option [value]="statusMatch.ACCEPTE">Accepté</option>
          <option [value]="statusMatch.REFUSE">Refusé</option>
          <option [value]="statusMatch.EXPIRE">Expiré</option>
        </select>
      </div>
  
     
  
      <!-- Montant Proposé -->
      <div class="mb-3">
        <label class="form-label">Montant Proposé (TND)</label>
        <input type="number" class="form-control" formControlName="montantPropose" placeholder="0.00" min="0" step="0.01">
      </div>
  
      <!-- Buttons -->
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-success" [disabled]="saving">
          {{ saving ? 'Creating...' : 'Create Match' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          Cancel
        </button>
      </div>
  
    </form>
  </div>
