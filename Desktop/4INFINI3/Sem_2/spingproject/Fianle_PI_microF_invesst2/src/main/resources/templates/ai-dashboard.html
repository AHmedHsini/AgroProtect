<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Dashboard</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f7fa;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #34495e;
        }

        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<h1>🧠 AI Dashboard</h1>

<div class="card">
    <h2>Project</h2>
    <p th:text="${project.name}"></p>
</div>

<div class="card">
    <h2>Success Probability</h2>
    <p th:text="${#numbers.formatDecimal(ai.success * 100, 1, 1)} + '%'"></p>
</div>

<div class="card">
    <h2>AI Explanation</h2>
    <p th:text="${ai.explanation}"></p>
</div>

<div class="card">
    <h2>Suggested Investors</h2>

    <div th:each="inv : ${ai.investments}">
        <p>
            👤 <span th:text="${inv.investor.name}"></span>
            | 💰 <span th:text="${#numbers.formatDecimal(inv.amount,1,2)}"></span>
              📊<span th:text="${#numbers.formatDecimal(inv.equityShare,1,2)} + '%'"></span>
        </p>
    </div>
</div>

</body>
</html>
