<div class="min-h-screen bg-[#0d0d0d] flex items-center justify-center p-4">

  <!-- Blob décoratif -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[500px] h-[500px]
              bg-[#00ff88]/5 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <a routerLink="/" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#00ff88]/10 border border-[#00ff88]/30
                    flex items-center justify-center">
          <svg viewBox="0 0 32 32" fill="none" class="w-6 h-6">
            <path d="M16 2C16 2 8 8 8 16C8 24 16 30 16 30C16 30 24 24 24 16C24 8 16 2 16 2Z"
                  fill="#00ff88" opacity="0.2"/>
            <path d="M16 6C16 6 10 11 10 17C10 23 16 28 16 28"
                  stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M16 6C16 6 22 11 22 17C22 23 16 28 16 28"
                  stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="3" fill="#00ff88"/>
          </svg>
        </div>
        <span class="font-display text-xl font-bold text-white">
          Agro<span class="text-[#00ff88]">Protect</span>
        </span>
      </a>
      <p class="mt-3 text-sm text-[#555]">Plateforme intelligente d'aide à la décision agricole</p>
    </div>

    <!-- Card -->
    <div class="bg-[#141414] border border-white/[0.06] rounded-2xl p-8">

      <h1 class="font-display text-2xl font-700 text-white mb-1">Connexion</h1>
      <p class="text-sm text-[#555] mb-8">Accédez à votre espace analyste</p>

      <!-- Alerte erreur -->
      @if (error()) {
        <div class="mb-6 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30
                    text-red-400 text-sm flex items-center gap-2">
          <svg viewBox="0 0 20 20" fill="none" class="w-4 h-4 flex-shrink-0">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6V10M10 14H10.01" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          {{ error() }}
        </div>
      }

      <!-- Info test -->
      <div class="mb-6 px-4 py-3 rounded-xl bg-[#00ff88]/5 border border-[#00ff88]/20
                  text-[#00ff88]/80 text-xs">
        🧪 Mode test — identifiants pré-remplis
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-xs font-600 text-[#888] uppercase tracking-wider mb-2">
            Email
          </label>
          <input formControlName="email" type="email"
                 placeholder="vous@agroprotect.dz"
                 class="w-full bg-[#1a1a1a] border border-white/[0.06] rounded-xl
                        px-4 py-3 text-sm text-white placeholder-[#444]
                        focus:outline-none focus:border-[#00ff88]/50
                        focus:ring-1 focus:ring-[#00ff88]/20 transition-all"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-600 text-[#888] uppercase tracking-wider mb-2">
            Mot de passe
          </label>
          <div class="relative">
            <input formControlName="password"
                   [type]="showPass() ? 'text' : 'password'"
                   placeholder="••••••••"
                   class="w-full bg-[#1a1a1a] border border-white/[0.06] rounded-xl
                          px-4 py-3 pr-12 text-sm text-white placeholder-[#444]
                          focus:outline-none focus:border-[#00ff88]/50
                          focus:ring-1 focus:ring-[#00ff88]/20 transition-all"/>
            <button type="button" (click)="showPass.set(!showPass())"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-[#555] hover:text-[#00ff88] transition-colors">
              @if (showPass()) {
                <svg viewBox="0 0 20 20" fill="none" class="w-4 h-4">
                  <path d="M2 10C2 10 5 4 10 4C15 4 18 10 18 10C18 10 15 16 10 16C5 16 2 10 2 10Z"
                        stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              } @else {
                <svg viewBox="0 0 20 20" fill="none" class="w-4 h-4">
                  <path d="M3 3L17 17M8.5 8.7C8.2 9 8 9.5 8 10C8 11.1 8.9 12 10 12C10.5 12 11 11.8 11.3 11.5"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M5.5 5.7C3.8 7 2 10 2 10C2 10 5 16 10 16C11.8 16 13.4 15.3 14.7 14.3"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M8 4.2C8.6 4.1 9.3 4 10 4C15 4 18 10 18 10C18 10 17.3 11.3 16 12.6"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loading()"
                class="w-full bg-[#00ff88] hover:bg-[#00e87a] disabled:opacity-60
                       text-black font-bold text-sm rounded-xl py-3.5 mt-2
                       transition-all hover:-translate-y-0.5
                       hover:shadow-[0_8px_24px_rgba(0,255,136,0.3)]
                       flex items-center justify-center gap-2">
          @if (loading()) {
            <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor"
                      stroke-width="3" stroke-dasharray="31" stroke-dashoffset="10"/>
            </svg>
            Connexion en cours...
          } @else {
            Accéder au Dashboard →
          }
        </button>

      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-[#444] mt-6">
      Pas encore de compte ?
      <a routerLink="/register" class="text-[#00ff88] hover:underline ml-1">Créer un compte</a>
    </p>

  </div>
</div>
